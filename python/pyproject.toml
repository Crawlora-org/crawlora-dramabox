[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-dramabox"
version = "0.1.0"
description = "Crawlora DramaBox API client with 16 endpoints for title discovery, categories, search, rankings, recommendations, and public title details"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "dramabox", "dramabox-api", "dramabox-scraper", "dramabox-data", "dramabox-title-discovery", "dramabox-categories", "dramabox-search", "dramabox-rankings", "dramabox-recommendations", "dramabox-public-title-details"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=dramabox-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=dramabox-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-dramabox"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_dramabox"]

[tool.setuptools.package-data]
"crawlora_dramabox" = ["py.typed", "*.pyi"]
